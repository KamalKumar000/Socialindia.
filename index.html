<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SocialIndia - Photo Video</title>
<style>
body{font-family:sans-serif;background:#f0f2f5;margin:0} .header{background:#0a66c2;color:#fff;padding:15px;text-align:center;font-size:22px;font-weight:bold;position:sticky;top:0}
.container{max-width:500px;margin:auto;padding:10px} .post-box{background:#fff;padding:15px;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.1);margin-bottom:15px}
textarea{width:100%;border:1px solid #ddd;border-radius:10px;padding:12px;font-size:16px;box-sizing:border-box;resize:none}
.input-row{display:flex;gap:10px;margin-top:10px} .btn{flex:1;padding:12px;border:none;border-radius:25px;font-weight:bold;cursor:pointer}
.btn-blue{background:#0a66c2;color:#fff} .btn-gray{background:#e4e6eb;color:#000;text-align:center}
.post{background:#fff;padding:15px;border-radius:12px;margin-bottom:15px} .post-name{font-weight:bold}
.post-text{margin:10px 0;white-space:pre-wrap} .post img,.post video{width:100%;border-radius:10px;margin-top:10px}
.actions{display:flex;border-top:1px solid #eee;margin-top:10px;padding-top:8px} .action-btn{flex:1;text-align:center;padding:6px;border:none;background:none;font-weight:bold;color:#65676b}
.action-btn.liked{color:#0a66c2} #preview,#previewVideo{width:100%;border-radius:10px;margin-top:10px;display:none;max-height:300px;object-fit:cover}
</style></head><body>
<div class="header">🇮🇳 SocialIndia</div>
<div class="container">
<div class="post-box">
<input id="nameInput" placeholder="Aapka Naam" style="width:100%;padding:10px;border-radius:20px;border:1px solid #ddd;margin-bottom:10px;box-sizing:border-box;">
<textarea id="textInput" rows="3" placeholder="Aap kya soch rahe ho?"></textarea>
<img id="preview"><video id="previewVideo" controls></video>
<div class="input-row">
<label class="btn btn-gray">📷 Photo/Video<input type="file" id="fileInput" accept="image/*,video/*" hidden></label>
<button class="btn btn-blue" onclick="createPost()">Post Karo</button>
</div></div>
<div id="posts"></div>
</div>
<script>
let selectedData=null,selectedType=null;
const fileInput=document.getElementById('fileInput'),previewImg=document.getElementById('preview'),previewVideo=document.getElementById('previewVideo');
fileInput.addEventListener('change',e=>{
 const file=e.target.files[0]; if(!file) return;
 const reader=new FileReader();
 reader.onload=ev=>{
  selectedData=ev.target.result;
  if(file.type.startsWith('image')){selectedType='image';previewImg.src=selectedData;previewImg.style.display='block';previewVideo.style.display='none';}
  else{selectedType='video';previewVideo.src=selectedData;previewVideo.style.display='block';previewImg.style.display='none';}
 }; reader.readAsDataURL(file);
});
let posts=JSON.parse(localStorage.getItem('socialIndiaPro')||'[]');
if(posts.length==0){posts=[{name:"SocialIndia Team",text:"Swagat hai! Ab Photo aur Video post karo 📷🎥",media:null,type:null,likes:12,liked:false}];}
function save(){localStorage.setItem('socialIndiaPro',JSON.stringify(posts));}
function createPost(){
 const name=document.getElementById('nameInput').value||'Kamal';
 const text=document.getElementById('textInput').value;
 if(!text && !selectedData){alert('Kuch likho ya photo jodo');return;}
 posts.unshift({name,text,media:selectedData,type:selectedType,likes:0,liked:false});
 save();render();
 document.getElementById('textInput').value='';selectedData=null;selectedType=null;previewImg.style.display='none';previewVideo.style.display='none';fileInput.value='';
}
function likePost(i){posts[i].liked=!posts[i].liked;posts[i].likes+=posts[i].liked?1:-1;save();render();}
function render(){
 document.getElementById('posts').innerHTML=posts.map((p,i)=>`
  <div class="post"><div class="post-name">${p.name}</div><div class="post-text">${p.text||''}</div>
  ${p.media?(p.type=='image'?`<img src="${p.media}">`:`<video src="${p.media}" controls></video>`):''}
  <div class="actions"><button class="action-btn ${p.liked?'liked':''}" onclick="likePost(${i})">👍 Like (${p.likes})</button>
  <button class="action-btn">💬 Comment</button>
  <button class="action-btn">↗️ Share</button></div></div>`).join('');
}
render();
</script></body></html>
